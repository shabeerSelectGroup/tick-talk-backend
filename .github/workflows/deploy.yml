name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ticktalk-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TickTalk API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/deploy/apps/ticktalk-api"
            cd "$APP_DIR"
            echo "Deploy path: $(pwd)"
            export DEPLOY_BRANCH=main
            if [ ! -f scripts/deploy.sh ]; then
              echo "ERROR: scripts/deploy.sh missing."
              ls -la
              exit 1
            fi
            bash scripts/deploy.sh

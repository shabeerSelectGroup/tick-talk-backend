# TickTalk UI — static SPA + API/WebSocket proxy (same origin for /api/v1).
server {
    listen 443 ssl http2;
    server_name ticktalk.thegamearcade.com;

    root /home/deploy/apps/ticktalk/dist;
    index index.html;

    access_log /var/log/nginx/ticktalk.access.log;
    error_log /var/log/nginx/ticktalk.error.log;

    client_max_body_size 25m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_pass http://127.0.0.1:8108/api/;
    }

    location /health {
        proxy_pass http://127.0.0.1:8108/health;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    ssl_certificate /etc/letsencrypt/live/ticktalk.thegamearcade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticktalk.thegamearcade.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ticktalk.thegamearcade.com;
    return 301 https://$host$request_uri;
}
